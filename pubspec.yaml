name: loymax_personal_offers
description: Flutter widgets for embedding Loymax personal offers via a WebView (carousel and full-screen list).
version: 1.0.2

repository: https://github.com/loymax/loymax-personal-offers-webview
issue_tracker: https://github.com/loymax/loymax-personal-offers-webview/issues

topics:
  - loymax
  - webview
  - personal-offers
  - loyalty
  - carousel

# MIT License — see LICENSE.

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
